[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 32
fail_on_revert = true

[rpc_endpoints]
robinhood = "https://robinhood-rpc.publicnode.com"
robinhood_testnet = "https://robinhood-sepolia-rpc.publicnode.com"
